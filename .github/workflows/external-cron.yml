name: External Cron (Hibernated)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Saisir RUN_ONCE pour autoriser une exécution exceptionnelle"
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - RUN_ONCE
      target:
        description: "Endpoint à appeler une seule fois"
        required: true
        default: dispatch
        type: choice
        options:
          - dispatch
          - worker
          - snapshot

jobs:
  run-external-cron:
    name: Run one explicitly authorized cron endpoint
    if: ${{ inputs.confirm == 'RUN_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: external-cron-manual
      cancel-in-progress: false

    steps:
      - name: Resolve target endpoint
        id: resolve
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            dispatch) PATH_SUFFIX="/api/cron/continuous/dispatch" ;;
            worker) PATH_SUFFIX="/api/cron/continuous/worker" ;;
            snapshot) PATH_SUFFIX="/api/cron/continuous/snapshot" ;;
            *)
              echo "Unknown target: $TARGET"
              exit 1
              ;;
          esac

          echo "path_suffix=$PATH_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Call cron endpoint once
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PATH_SUFFIX: ${{ steps.resolve.outputs.path_suffix }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CRON_BASE_URL:-}" ]; then
            echo "Missing secret CRON_BASE_URL"
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing secret CRON_SECRET"
            exit 1
          fi

          BASE_URL="${CRON_BASE_URL%/}"
          URL="${BASE_URL}${PATH_SUFFIX}"

          echo "Calling one authorized endpoint: $URL"

          curl --request GET "$URL" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --fail-with-body \
            --retry 1 \
            --retry-all-errors \
            --max-time 60
