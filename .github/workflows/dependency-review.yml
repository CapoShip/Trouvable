name: Dependency Review (Hibernated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hibernation-notice:
    name: Confirm dependency automation is paused
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Report hibernation state
        run: |
          echo "Trouvable is hibernating."
          echo "Automatic dependency review is intentionally paused."
          echo "Restore the previous workflow from Git history before reviving the application."
