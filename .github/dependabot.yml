version: 2

# Trouvable is in reversible hibernation. Version-update pull requests are
# intentionally disabled to prevent CI and Vercel preview churn. Dependabot
# security alerts remain available in GitHub and can be reviewed manually.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
